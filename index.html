<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平行趋势检验组合生成器 Ultimate</title>
    <!-- 引用 favo.png -->
    <link rel="icon" href="favo.png" type="image/png">
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #6c5ce7;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-color: #ddd;
            --stata-color: #882255; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 950px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        h1 img {
            height: 32px;
            width: 32px;
            border-radius: 4px;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .form-item {
            display: flex;
            flex-direction: column;
        }

        .form-item label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }

        .form-item input, .form-item select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-item input:focus, .form-item select:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        /* 归并区域样式 */
        .binning-wrapper {
            grid-column: 1 / -1;
            background-color: #f8f9fa;
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 5px;
        }

        .binning-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            user-select: none;
        }

        .binning-header label {
            font-weight: bold;
            color: var(--secondary-color);
            cursor: pointer;
        }

        .binning-controls {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .binning-controls.active {
            display: grid;
        }

        .binning-hint-text {
            grid-column: 1 / -1;
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .options-area {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #eee;
            cursor: pointer;
        }
        
        .checkbox-group:hover {
            background: #f0f7ff;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .stata-option {
            border-left: 4px solid var(--stata-color);
        }

        button.generate-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button.generate-btn:hover {
            background-color: #357abd;
        }

        .output-section {
            margin-top: 25px;
        }

        textarea {
            width: 100%;
            height: 350px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
            background-color: #fafafa;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .copy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }
        
        .copy-btn:hover {
            background-color: #218838;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        <img src="favo.png" onerror="this.style.display='none'" alt="icon"> 
        平行趋势检验组合生成器 Pro
    </h1>

    <div class="input-group">
        <!-- 基础参数 -->
        <div class="form-item">
            <label>样本起始年份</label>
            <input type="number" id="startYear" placeholder="2000" value="2000">
        </div>
        <div class="form-item">
            <label>样本结束年份</label>
            <input type="number" id="endYear" placeholder="2020" value="2020">
        </div>
        <div class="form-item">
            <label>最早政策时点</label>
            <input type="number" id="minPolicy" placeholder="2008" value="2008">
        </div>
        <div class="form-item">
            <label>最晚政策时点</label>
            <input type="number" id="maxPolicy" placeholder="2012" value="2012">
        </div>
        <div class="form-item">
            <label>最少 Before 数量</label>
            <input type="number" id="minPre" value="2" min="1">
            <div class="hint">左侧至少保留几个点？</div>
        </div>
        <div class="form-item">
            <label>最少 After 数量</label>
            <input type="number" id="minPost" value="2" min="1">
            <div class="hint">右侧至少保留几个点？(输入2则至少到After2)</div>
        </div>

        <!-- 归并设置区域 -->
        <div class="binning-wrapper">
            <div class="binning-header" onclick="toggleBinning()">
                <input type="checkbox" id="enableBinning">
                <label for="enableBinning">启用归并计算 (Binning)</label>
            </div>
            <div class="binning-controls" id="binningControls">
                <div class="form-item">
                    <label>归并 Before (起始)</label>
                    <input type="number" id="binPreInput" value="3" min="3">
                    <div class="hint">从 Before3_ 开始自动遍历</div>
                </div>
                <div class="form-item">
                    <label>归并 After (起始)</label>
                    <input type="number" id="binPostInput" value="3" min="3">
                    <div class="hint">从 After3_ 开始自动遍历</div>
                </div>
            </div>
        </div>

        <div class="form-item" style="grid-column: 1 / -1; margin-top:10px;">
            <label>基期选择 (Reference)</label>
            <select id="basePeriod">
                <option value="none">无 (None)</option>
                <option value="0">基期 0 (剔除 After0)</option>
                <option value="-1" selected>基期 -1 (剔除 Before1)</option>
            </select>
        </div>

        <div class="options-area">
            <div class="checkbox-group">
                <input type="checkbox" id="showBoth">
                <label for="showBoth">同时输出 [无基期] 结果</label>
            </div>
            
            <div class="checkbox-group stata-option">
                <input type="checkbox" id="stataLoopMode">
                <label for="stataLoopMode">生成 Stata 循环格式 (local plist)</label>
            </div>
        </div>
    </div>

    <button class="generate-btn" onclick="generateCombinations()">生成组合代码</button>

    <div class="output-section">
        <label style="font-weight:bold; color:#555;">生成结果:</label>
        <textarea id="resultOutput" readonly></textarea>
        <button class="copy-btn" onclick="copyResult()">复制结果</button>
    </div>
</div>

<script>
    function toggleBinning() {
        const checkbox = document.getElementById('enableBinning');
        const controls = document.getElementById('binningControls');
        if (checkbox.checked) {
            controls.classList.add('active');
        } else {
            controls.classList.remove('active');
        }
    }
    
    document.querySelector('.binning-header').addEventListener('click', function(e) {
        if (e.target.tagName !== 'INPUT') {
            const checkbox = document.getElementById('enableBinning');
            checkbox.checked = !checkbox.checked;
            toggleBinning();
        }
    });

    // 辅助函数：生成左侧序列
    function getLeftSequence(maxB, stopB, binAt) {
        if (binAt && binAt >= 3) {
            // 归并模式：固定生成单条 Before{binAt}_ ...
            let list = [`Before${binAt}_`];
            for (let i = binAt - 1; i >= 1; i--) list.push(`Before${i}`);
            return [list];
        } else {
            // 普通模式：循环生成
            let combinations = [];
            for (let b = maxB; b >= stopB; b--) {
                let list = [];
                for (let i = b; i >= 1; i--) list.push(`Before${i}`);
                combinations.push(list);
            }
            return combinations;
        }
    }

    // 辅助函数：生成右侧序列
    function getRightSequence(maxA, stopA, binAt) {
        if (binAt && binAt >= 3) {
            // 归并模式
            let list = [];
            for (let i = 0; i < binAt; i++) list.push(`After${i}`);
            list.push(`After${binAt}_`);
            return [list];
        } else {
            // 普通模式
            let combinations = [];
            for (let a = maxA; a >= stopA; a--) {
                let list = [];
                for (let i = 0; i <= a; i++) list.push(`After${i}`);
                combinations.push(list);
            }
            return combinations;
        }
    }

    function generateCombinations() {
        const start = parseInt(document.getElementById('startYear').value);
        const end = parseInt(document.getElementById('endYear').value);
        const minPol = parseInt(document.getElementById('minPolicy').value);
        const maxPol = parseInt(document.getElementById('maxPolicy').value);
        const minPreCnt = parseInt(document.getElementById('minPre').value);
        const minPostCnt = parseInt(document.getElementById('minPost').value);
        const base = document.getElementById('basePeriod').value;
        const showBoth = document.getElementById('showBoth').checked;
        const stataMode = document.getElementById('stataLoopMode').checked;
        const isBinning = document.getElementById('enableBinning').checked;
        
        let binPreInput = parseInt(document.getElementById('binPreInput').value);
        let binPostInput = parseInt(document.getElementById('binPostInput').value);

        if (isNaN(start) || isNaN(end) || isNaN(minPol) || isNaN(maxPol)) {
            alert("请输入完整的年份信息"); return;
        }

        const maxBeforeVal = maxPol - start;
        const maxAfterVal = end - minPol;

        // 计算停止位逻辑修正
        // Before逻辑: 如果 minPre=2 且 base=-1 (Before1剔除), 必须到 Before3。
        let stopBeforeIndex = minPreCnt; 
        if (base === '-1') stopBeforeIndex = minPreCnt + 1;
        
        // After逻辑 (修正): 
        // 用户要求: "最少After数量为2的时候，After应该也至少到After2"
        // 意味着下标 stopIndex 必须 >= 2
        let stopAfterIndex = minPostCnt;
        
        // 双重校验：如果是默认0(剔除After0)，After1, After2 (满足2个)。
        // 如果是None，After0, After1, After2 (3个，但也满足“至少到After2”)
        // 所以直接设为 input 值是符合“至少到 After{input}”这个要求的。

        if (maxBeforeVal < stopBeforeIndex || maxAfterVal < stopAfterIndex) {
            alert("时间跨度不足以生成满足最小数量要求的组合，请检查年份或最小数量设置。"); return;
        }

        let resultItems = [];

        // 核心函数：组合并添加
        function combineAndPush(lCollection, rCollection) {
            if (!lCollection.length || !rCollection.length) return;
            for (let lList of lCollection) {
                for (let rList of rCollection) {
                    let rawList = lList.concat(rList);
                    let processedList = [];
                    if (base === 'none') {
                        processedList = [...rawList];
                    } else {
                        processedList = rawList.filter(token => {
                            if (base === '0' && token === 'After0') return false;
                            if (base === '-1' && token === 'Before1') return false;
                            return true;
                        });
                    }
                    const separator = stataMode ? ";" : " ";
                    if (showBoth && base !== 'none') {
                        resultItems.push(rawList.join(separator));
                        resultItems.push(processedList.join(separator));
                    } else {
                        resultItems.push(processedList.join(separator));
                    }
                }
            }
        }

        // 1. 标准组合 (不归并)
        const leftNormal = getLeftSequence(maxBeforeVal, stopBeforeIndex, null);
        const rightNormal = getRightSequence(maxAfterVal, stopAfterIndex, null);
        combineAndPush(leftNormal, rightNormal);

        // 如果启用归并
        if (isBinning) {
            if (binPreInput < 3) binPreInput = 3;
            if (binPostInput < 3) binPostInput = 3;

            // 自动遍历生成目标列表
            let targetBinPreValues = [];
            for (let k = binPreInput; k <= maxBeforeVal; k++) targetBinPreValues.push(k);
            
            let targetBinPostValues = [];
            for (let k = binPostInput; k <= maxAfterVal; k++) targetBinPostValues.push(k);
            
            // Group 2: 左归并，右不归并
            for (let bVal of targetBinPreValues) {
                let lBinned = getLeftSequence(maxBeforeVal, stopBeforeIndex, bVal);
                combineAndPush(lBinned, rightNormal);
            }

            // Group 3: 左不归并，右归并
            for (let aVal of targetBinPostValues) {
                let rBinned = getRightSequence(maxAfterVal, stopAfterIndex, aVal);
                combineAndPush(leftNormal, rBinned);
            }

            // Group 4: 两侧都归并 (仅当有基期)
            if (base !== 'none') {
                for (let bVal of targetBinPreValues) {
                    for (let aVal of targetBinPostValues) {
                         let lBinned = getLeftSequence(maxBeforeVal, stopBeforeIndex, bVal);
                         let rBinned = getRightSequence(maxAfterVal, stopAfterIndex, aVal);
                         combineAndPush(lBinned, rBinned);
                    }
                }
            }
        }

        // 渲染
        const textarea = document.getElementById('resultOutput');
        if (resultItems.length === 0) {
            textarea.value = "无结果"; return;
        }

        if (stataMode) {
            const finalString = `local plist "${resultItems.join(" ")}"`;
            textarea.value = finalString;
        } else {
            textarea.value = resultItems.join("\n");
        }
    }

    function copyResult() {
        const textarea = document.getElementById('resultOutput');
        textarea.select();
        document.execCommand('copy');
        const btn = document.querySelector('.copy-btn');
        const originalText = btn.innerText;
        btn.innerText = "复制成功!";
        btn.style.backgroundColor = "#218838";
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = "#28a745";
        }, 1500);
    }
</script>

</body>
</html>
